name: Build Thirst Mod  
  
on:  
  push:  
    branches: [ 1.20.1-4.0-test ]  
  pull_request:  
    branches: [ 1.20.1-4.0-test ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
      
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
          
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
            
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
          
      - name: Build with Gradle  
        run: ./gradlew build --no-daemon  
          
      - name: Upload build artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: ThirstWasTaken-${{ github.sha }}  
          path: build/libs/*.jar  
          retention-days: 30  
            
      - name: Upload build artifacts (with date)  
        uses: actions/upload-artifact@v4  
        with:  
          name: ThirstWasTaken-latest  
          path: build/libs/*.jar  
          retention-days: 90